name: Validate links

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: validate-links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-links:
    name: Validate links
    permissions:
      issues: write
      contents: read
    uses: backend-br/.github/.github/workflows/validate-links.yml@9e4bf553947273dcb44ef6ca52df19ce048b2820
    with:
      build-site: true
      lychee-args: "--verbose --no-progress --root-dir ${{ github.workspace }}/dist './README.md' './dist/**/*.html'"
